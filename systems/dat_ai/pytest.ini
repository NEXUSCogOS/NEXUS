[pytest]
testpaths = tests
python_files = test_*.py
markers =
    unit: no network, no database, no credentials
    integration: requires a live PostGIS database
    external: requires outbound network to a third-party service
    commissioning: requires real CDSE credentials and transfers real bytes
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
